ML
name: daily-fare-check
 
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:       # lets you run it manually from the Actions tab
 
permissions:
  contents: write
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Run tracker
        run: python tracker.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
 
      - name: Commit logs
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add *.csv
          git diff --cached --quiet || git commit -m "Fare log $(date -u +%F)"
          git push
